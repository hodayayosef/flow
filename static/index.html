<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flow</title>
<meta name="description" content="ניהול כסף חודשי חכם ומסודר">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="theme-color" content="#cdeafb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flow">
<link rel="stylesheet" href="/static/fonts.css">
<style>
/* base reset */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: folder sidebar (accounts + monthly charts) | main ledger (summary, icon grid, insights) or charts view | beige notes column */
:root{
  --bg:#eef6fb; --surface:#ffffff; --surface-2:#f5f9fd; --fg:#1a2533; --muted:#617387; --line:#d5e4ef;
  --accent:#2a8cc4; --accent-soft:#dcf0fb; --track:#e1edf5;
  --pink:#e0679a; --pink-soft:#fde6ef;
  --sky:#cdeafb; --sky-fg:#12324a;
  --ok:#2e8a5f; --warn:#c7841c; --over:#c43d4b; --over-soft:#f8e1e4; --warn-soft:#f8ecd6;
  --note:#f3ebdd; --note-line:#ddcfb6; --note-head:#8a6a45;
  --c1:#2a8cc4; --c2:#e0679a; --c3:#1d5f8c; --c4:#f2a3c2; --c5:#62b6df; --c6:#a8487a; --c7:#9fb0bf;
  --e-pink:#f7c9da; --e-blue:#c2e3f7; --e-lilac:#dccbf2; --e-green:#c9ead2; --e-beige:#efe3cc; --e-brown:#dcc4ac; --e-gray:#dfe4e8; --e-fg:#2b2a33;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:#a9dbf5; --sky-fg:#0e2433;
  --bg:#0f1720; --surface:#17212c; --surface-2:#1d2935; --fg:#e7eef5; --muted:#94a6b8; --line:#2b3a49;
  --accent:#6cc4ef; --accent-soft:#1b3445; --track:#243241; --pink:#f08cb4; --pink-soft:#3a1f2c;
  --c1:#6cc4ef; --c2:#f08cb4; --c3:#3d8fc2; --c4:#c45f8e; --c5:#a9dbf5; --c6:#f6c1d6; --c7:#5d6f80;
  --ok:#5cc28c; --warn:#e3a646; --over:#ef7682; --over-soft:#3a1f24; --warn-soft:#3a2e1b; --note:#28231b; --note-line:#453c2e; --note-head:#d6b88f; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#a9dbf5; --sky-fg:#0e2433;
  --bg:#0f1720; --surface:#17212c; --surface-2:#1d2935; --fg:#e7eef5; --muted:#94a6b8; --line:#2b3a49;
  --accent:#6cc4ef; --accent-soft:#1b3445; --track:#243241; --pink:#f08cb4; --pink-soft:#3a1f2c;
  --c1:#6cc4ef; --c2:#f08cb4; --c3:#3d8fc2; --c4:#c45f8e; --c5:#a9dbf5; --c6:#f6c1d6; --c7:#5d6f80;
  --ok:#5cc28c; --warn:#e3a646; --over:#ef7682; --over-soft:#3a1f24; --warn-soft:#3a2e1b; --note:#28231b; --note-line:#453c2e; --note-head:#d6b88f; color-scheme:dark}

:root[data-palette="sea"]{--pink:#23907f;--pink-soft:#d6f0ec;--c2:#23907f;--c4:#8fd3c7;--c6:#1f6f63}
:root[data-palette="slate"]{--pink:#5562cf;--pink-soft:#e3e6fb;--c2:#5562cf;--c4:#a9b2ef;--c6:#3b48a8}
@media (prefers-color-scheme:dark){
  :root[data-palette="sea"]:not([data-theme="light"]){--pink:#5fc9b8;--pink-soft:#173a35;--c2:#5fc9b8;--c4:#2f7e72;--c6:#a6e3d9}
  :root[data-palette="slate"]:not([data-theme="light"]){--pink:#9aa6f5;--pink-soft:#23284a;--c2:#9aa6f5;--c4:#5c66b8;--c6:#c9cff9}}
:root[data-theme="dark"][data-palette="sea"]{--pink:#5fc9b8;--pink-soft:#173a35;--c2:#5fc9b8;--c4:#2f7e72;--c6:#a6e3d9}
:root[data-theme="dark"][data-palette="slate"]{--pink:#9aa6f5;--pink-soft:#23284a;--c2:#9aa6f5;--c4:#5c66b8;--c6:#c9cff9}
.swatches{display:flex;gap:8px;padding-inline:8px}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);padding:0;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%)}
.swatch.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;direction:rtl}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:1.7rem;letter-spacing:.01em}
h2{font-size:1.15rem}
.lbl{font-size:.78rem;color:var(--muted);letter-spacing:.04em;font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.htitle{display:flex;align-items:center;gap:12px}
.foldbtn{display:grid;border:1px solid var(--line);background:var(--surface);border-radius:12px;width:42px;height:42px;place-items:center;color:var(--pink)}
.month{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.month button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.month button:hover{background:var(--surface-2)}
.month span{min-width:120px;text-align:center;font-weight:700}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.status.local i{background:var(--warn)}

/* shell */
.shell{display:grid;grid-template-columns:0px minmax(0,1fr);column-gap:0;row-gap:18px;align-items:start;transition:grid-template-columns .22s ease,column-gap .22s ease}
.shell.open{grid-template-columns:270px minmax(0,1fr);column-gap:18px}
.folder{display:none;position:sticky;top:max(16px,env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;flex-direction:column;gap:16px;overflow:hidden;min-width:0}
.folder.open{display:flex}
.fold-head{display:flex;align-items:center;gap:8px;color:var(--pink)}
.fold-head h2{color:var(--fg)}
.fold-sec{display:flex;flex-direction:column;gap:4px}
.fold-sec>.lbl{padding-inline:8px;margin-bottom:2px}
.fitem{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:10px;padding:8px;text-align:start;width:100%;font-weight:600}
.fitem:hover{background:var(--surface-2)}
.fitem.on{background:var(--pink-soft);color:var(--fg)}
.fitem.on svg{color:var(--pink)}
.fitem svg.ic{width:20px;height:20px;flex:none;color:var(--accent)}
.fitem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem small{color:var(--muted);font-weight:400}
.fitem.add{color:var(--muted);border:1px dashed var(--line)}
.fitem .edit{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.fitem .edit:hover{background:var(--surface)}
.fitem .edit svg.ic{width:15px;height:15px;color:inherit}
.bform{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:10px;padding:10px}
.bform .btns{display:flex;gap:6px;flex-wrap:wrap}
.bform p{margin:0;font-size:.88rem}
.small{padding:7px 12px;font-size:.88rem}
.danger{background:var(--over);color:var(--surface);border:0;border-radius:10px;font-weight:700}
.linkbtn{border:0;background:transparent;color:var(--over);font-size:.85rem;padding:4px 0;text-align:start}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.income{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:0 10px}
.money input{border:0;background:transparent;width:100%;padding:10px 4px;font-size:1.1rem;font-weight:700;outline:none;font-variant-numeric:tabular-nums}
.money:focus-within{border-color:var(--accent)}
.money b{color:var(--muted);font-weight:600}

.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:stretch}
.free{background:var(--sky);color:var(--sky-fg);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.free .lbl{color:inherit;opacity:.85}
.free .big{font-family:var(--display);font-size:clamp(2.4rem,7vw,3.4rem);line-height:1.05}
.free p{margin:0;opacity:.9}
.free.neg{background:var(--over);color:var(--surface)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat strong{font-size:1.25rem}
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:6px}
.bar>div{height:100%;background:var(--accent);border-radius:inherit;transition:width .4s}

.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-head p{margin:0;color:var(--muted);font-size:.88rem}
.toggle{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.ghost{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:600}
.ghost:hover{border-color:var(--pink);background:var(--pink-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.tile{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--pink)}
.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rc,var(--accent)) calc(var(--p,0)*1%),var(--track) 0)}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--rc,var(--accent))}
.ring.empty{background:var(--track)}
.ring.empty span{color:var(--muted)}
svg.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile .amt{font-weight:700;font-size:.95rem}
.tile .of{font-size:.72rem;color:var(--muted)}
.tile .nm{font-size:.78rem;color:var(--muted);text-align:center;line-height:1.25}
.tile.over{border-color:var(--over);background:var(--over-soft)}
.tile .dot{position:absolute;top:8px;left:8px;width:8px;height:8px;border-radius:50%;background:var(--over)}

.insights{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.insights li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.insights li.warn{background:var(--warn-soft);border-color:transparent}
.insights li.over{background:var(--over-soft);border-color:transparent}
.insights li.good{background:var(--accent-soft);border-color:transparent}
.insights li.info{background:var(--pink-soft);border-color:transparent}
.insights svg.ic{width:20px;height:20px;flex:none;margin-top:2px}

.recent{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .mini{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.row:nth-child(even) .mini{background:var(--pink-soft);color:var(--pink)}
.row .mini svg.ic{width:18px;height:18px}
.row .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .txt small{color:var(--muted);display:block}
.row .del{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:50%}
.row .del:hover{background:var(--over-soft);color:var(--over)}
.empty-note{color:var(--muted);text-align:center;padding:18px 8px}

/* charts */
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.charts .wide{grid-column:1/-1}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:200px;max-width:100%;flex:none}
.donut text{fill:var(--fg);font-family:var(--body)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}
.legend li{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:.92rem}
.legend i{width:12px;height:12px;border-radius:3px}
.legend span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend em{font-style:normal;color:var(--muted);font-size:.82rem;min-width:36px;text-align:start}
.bva{display:flex;flex-direction:column;gap:12px}
.bva .r{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center}
.bva .r svg.ic{width:22px;height:22px;color:var(--accent)}
.bva .top{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.bva .top span:last-child{color:var(--muted)}
.bva .track{position:relative;height:10px;background:var(--track);border-radius:999px;margin-top:4px}
.bva .fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px;background:var(--accent)}
.bva .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);border-radius:2px}
.cols{width:100%;height:auto;display:block}
.cols text{fill:var(--muted);font-family:var(--body);font-size:12px}
.cols .val{fill:var(--fg);font-size:11px;font-weight:700}
.cols-wrap{overflow-x:auto}
.keyrow{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.keyrow span{display:flex;align-items:center;gap:6px}
.keyrow i{width:12px;height:12px;border-radius:3px;display:inline-block}

.tile.addcat{border-style:dashed;background:transparent;justify-content:center}
.tile.addcat .nm{color:var(--pink);font-weight:600}
.tile.addcat .ring span{color:var(--pink)}
.pick-group{display:flex;flex-direction:column;gap:8px}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;text-align:start;min-width:0}
.pick svg.ic{width:20px;height:20px;flex:none;color:var(--accent)}
.pick span{flex:1;min-width:0;font-size:.9rem;line-height:1.25}
.pick.on{border-color:var(--pink);background:var(--pink-soft)}
.pick.on svg.ic{color:var(--pink)}
.pick svg.ck{width:16px;height:16px}
@media (max-width:520px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tile{padding:10px 4px 8px;gap:4px}
  .ring{width:50px;height:50px}.ring span{width:40px;height:40px}
  .tile svg.ic{width:22px;height:22px}
  .tile .amt{font-size:.88rem}
}
.catlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.crow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:5px 6px;min-width:0}
.crow.over{border-color:var(--over);background:var(--over-soft)}
.cinfo{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:transparent;text-align:start;padding:2px;border-radius:8px}
.cinfo:hover .t b{color:var(--pink)}
.cinfo{gap:8px}
.cinfo .ring{width:34px;height:34px;flex:none}.cinfo .ring span{width:27px;height:27px}.cinfo svg.ic{width:16px;height:16px}
.cinfo .t b{font-size:.92rem}
.cinfo .t small{font-size:.74rem!important}
.cinfo .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.cinfo .t b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cinfo .t small{color:var(--muted);font-size:.8rem}
.crow.over .cinfo .t small{color:var(--over)}
.cadd{display:flex;align-items:center;gap:4px;flex:none}
.cadd input{width:78px;background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:5px 4px;font-size:.92rem;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cadd input:focus{border-color:var(--pink);outline:none}
.cadd button{width:30px;height:30px;border-radius:8px;border:0;background:var(--pink-soft);color:var(--pink);display:grid;place-items:center}
.cadd button svg.ic{width:18px;height:18px}
.crow.addcat{justify-content:center;border-style:dashed;background:transparent;color:var(--pink);font-weight:600;min-height:46px;gap:6px}
.crow.addcat svg.ic{width:20px;height:20px}
@media (max-width:520px){.catlist{grid-template-columns:1fr}.cadd input{width:72px}}
.motto{display:flex;flex-direction:column;background:var(--pink-soft);border-color:transparent}
.motto textarea{flex:1;width:100%;min-height:120px;resize:none;border:0;background:transparent;outline:none;font-family:var(--display);font-size:clamp(1.3rem,3vw,1.7rem);line-height:1.35;text-align:center;color:var(--fg);text-wrap:balance;padding:8px 4px}
.motto textarea::placeholder{color:var(--muted);opacity:.7}
.motto .saved{font-size:.78rem;color:var(--muted);min-height:1.2em;text-align:center}
.split{display:flex;gap:2px;height:8px;border-radius:999px;overflow:hidden;margin-top:6px;background:var(--track)}
.crow.fx{border-inline-start:4px solid var(--accent)}
.crow.vr{border-inline-start:4px solid var(--pink)}
.ring.empty span{color:var(--rc,var(--muted))!important;opacity:.8}
.pickwrap{display:flex;gap:4px;min-width:0}
.pickwrap .pick{flex:1}
.pdel{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;width:32px;color:var(--muted)}
.pdel:hover{color:var(--over);background:var(--over-soft)}
.icpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.icpick label{display:block}
.icpick input{position:absolute;opacity:0;pointer-events:none}
.icpick span{display:grid;place-items:center;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--accent);cursor:pointer}
.icpick span svg.ic{width:20px;height:20px}
.icpick input:checked+span{border-color:var(--pink);background:var(--pink-soft);color:var(--pink)}
.icpick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.nmline{display:flex;align-items:baseline;gap:6px;min-width:0}
.nmline b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnote{font-style:normal;font-size:.72rem;font-weight:600;background:var(--pink-soft);color:var(--pink);border-radius:999px;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;flex:none}
.cnbtn{border:0;background:transparent;width:26px;height:26px;border-radius:50%;color:var(--muted);display:grid;place-items:center;flex:none}
.cnbtn:hover{background:var(--pink-soft);color:var(--pink)}
.cnbtn svg.ic{width:14px;height:14px}
.cnform{flex:none}
.cnform input{width:100px;border:1.5px solid var(--pink);border-radius:8px;padding:5px 6px;background:var(--surface);font-size:.85rem;outline:none}
.ic.sm{width:16px;height:16px;vertical-align:-3px}
.edit.trash:hover{color:var(--over)!important;background:var(--over-soft)!important}

(function(){
  const MIME={csv:'text/csv;charset=utf-8',json:'application/json',png:'image/png',pdf:'application/pdf'};
  const downloads={async save({filename,data}){
    const ext=(filename.split('.').pop()||'').toLowerCase();
    const blob=data instanceof Blob?data:new Blob([data],{type:MIME[ext]||'application/octet-stream'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return {status:'saved'};
  }};
  window.claude={use:async n=>n==='downloads'?downloads:null};
  if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
})();

  async getRaw(name){
    await this.chain;
    if(this.mode==='db'){
      try{const r=await fetch(this.url(name),{credentials:'same-origin'});
        if(r.status===401){location.href='/login';return null}

      const r=await fetch(this.url(name),{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body});
      if(r.status===401){location.href='/login';return}
      if(!r.ok) throw new Error('save '+r.status);
    }).catch(()=>setStatus('השמירה נכשלה, כדאי לנסות שוב',true));
    else{try{localStorage.setItem('kis-'+name,body)}catch(e){}}

/* ---------- calculations ---------- */
function calc(){
  const income=(+M.salary||0)+(+M.extra||0);
  const spentBy={};let spent=0;
  for(const e of M.expenses){spentBy[e.c]=(spentBy[e.c]||0)+(+e.a||0);spent+=(+e.a||0)}
  const planned=Object.values(M.budgets).reduce((s,v)=>s+(+v||0),0);
  const vat=vatOf(income);
  const free=income-vat-(+M.savings||0)-spent;
  const isCurMonth=keyOf(cur)===keyOf(now);
  const dim=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
  const day=isCurMonth?now.getDate():(cur<now?dim:0);
  const daysLeft=isCurMonth?dim-now.getDate()+1:(cur>now?dim:0);
  return{income,spent,spentBy,planned,free,dim,day,daysLeft,isCurMonth,vat};
}

function insights(c){
  const out=[];const bz=biz();
  const ds=(M.deferred||[]).reduce((s,e)=>s+(+e.a||0),0);
  if(ds>0) out.push(['info','payments',`${nis(ds)} ששילמת באשראי ירדו בחודש הבא, וכבר רשומים שם במקום לשכוח אותם.`]);
  if(!c.income){out.push(['info','info',bz?'מתחילים מהזנת ההכנסות של העסק החודש למעלה, ואז קובעים תקציב לכל קטגוריה בלחיצה על שם הקטגוריה.':'מתחילים מהזנת המשכורת של החודש למעלה, ואז קובעים תקציב לכל קטגוריה בלחיצה על שם הקטגוריה.']);return out}
  if(M.savings>0){
    if(c.free>=0) out.push(['good','check',`${bz?'הסכום להשאיר בעסק':'יעד החיסכון'} של ${nis(M.savings)} שמור בצד. כל מה שמוצג כ"פנוי" כבר אחריו.`]);
    else out.push(['over','alert',`ההוצאות כבר אוכלות ${nis(-c.free)} מתוך ${bz?'הסכום שרצית להשאיר בעסק':'יעד החיסכון'}.`]);
  }else if(!bz) out.push(['info','coins',`עוד לא הוגדר יעד חיסכון. גם ${nis(Math.round(c.income*0.1))} (10% מההכנסה) זו התחלה טובה.`]);
  const room=c.income-(+M.savings||0);
  if(c.planned>room) out.push(['warn','alert',`התקציבים שתכננת (${nis(c.planned)}) גבוהים מההכנסה הפנויה (${nis(room)}) ב-${nis(c.planned-room)}.`]);
  for(const k of cats().filter(k=>M.budgets[k.id]>0&&(c.spentBy[k.id]||0)>M.budgets[k.id])) out.push(['over','alert',`<b>${esc(k.name)}</b> עברה את התקציב ב-${nis(c.spentBy[k.id]-M.budgets[k.id])}.`]);
  if(c.isCurMonth&&c.planned>0){
    const flex=cats().filter(k=>!isFixed(k.id));
    const flexSpent=flex.reduce((s,k)=>s+(c.spentBy[k.id]||0),0), flexPlan=flex.reduce((s,k)=>s+(+M.budgets[k.id]||0),0);
    if(flexPlan>0&&flexSpent>flexPlan*(c.day/c.dim)*1.15) out.push(['warn','info',`ההוצאות השוטפות מקדימות את הקצב: עברו ${Math.round(c.day/c.dim*100)}% מהחודש ונוצלו ${Math.round(flexSpent/flexPlan*100)}% מהתקציב.`]);
    else if(c.spent<=c.planned*(c.day/c.dim)) out.push(['good','check','הקצב שלך טוב ביחס לתכנון של החודש.']);
  }
  return out;
}

function ringStyle(spent,budget,base='var(--accent)'){
  if(!budget) return {cls:spent?'':'empty',style:spent?`--p:100;--rc:${base}`:`--rc:${base}`};
  const p=Math.min(100,spent/budget*100);
  const rc=spent>budget?'var(--over)':p>=85?'var(--warn)':base;
  return{cls:'',style:`--p:${p};--rc:${rc}`};
}

    <label class="field"><span class="lbl">הכנסה נוספת</span><span class="money"><b>₪</b><input id="extra" inputmode="decimal" type="number" min="0" placeholder="0" value="${M.extra||''}"></span></label>
    <label class="field"><span class="lbl">${bz?'סכום להשאיר בעסק':'יעד חיסכון החודש'}</span><span class="money"><b>₪</b><input id="savings" inputmode="decimal" type="number" min="0" placeholder="0" value="${M.savings||''}"></span></label>
    ${bz?`<div class="vatline"><span>${(B().vat||'murshe')==='murshe'?`מתוך ההכנסות, כ-${nis(c.vat)} הם מע״מ (<span class="num">18%</span>) שצריך להעביר. הסכום הפנוי כבר מחושב בלעדיו.`:'עוסק פטור: אין מע״מ על ההכנסות.'}</span>
      <select class="txtin" id="vatType" aria-label="סוג העוסק"><option value="murshe" ${(B().vat||'murshe')==='murshe'?'selected':''}>עוסק מורשה</option><option value="patur" ${B().vat==='patur'?'selected':''}>עוסק פטור</option></select></div>`:''}
  </section>

  <section class="hero" data-sec="hero">
    <div class="free ${c.free<0?'neg':''}">
      <span class="lbl">${c.free<0?'חריגה מעבר לתקציב':bz?'נשאר בעסק אחרי הוצאות':'פנוי להוצאה החודש'}</span>
      <span class="big num">₪${fmt.format(Math.round(Math.abs(c.free)))}</span>
      <p>${c.daysLeft>0&&c.free>0?`בערך ${nis(perDay)} ליום ב-${c.daysLeft} הימים שנשארו`:c.free<0?'כדאי לעצור הוצאות לא הכרחיות עד סוף החודש':c.isCurMonth?'אחרי חיסכון והוצאות':'סיכום החודש אחרי חיסכון והוצאות'}</p>
    </div>
    <div class="stats">
      <div class="stat"><span class="lbl">סה״כ הכנסות</span><strong>${nis(c.income)}</strong></div>
      <div class="stat"><span class="lbl">הוצאות עד כה</span><strong>${nis(c.spent)}</strong></div>
      <div class="stat"><span class="lbl">מתוכנן בקטגוריות</span><strong>${nis(c.planned)}</strong></div>
      <div class="stat"><span class="lbl">${bz?'נשמר בעסק':'הצלחת לחסוך'}</span><strong>${nis(Math.max(0,Math.min(+M.savings||0,(+M.savings||0)+c.free)))}</strong></div>
      ${c.vat?`<div class="stat" style="grid-column:1/-1"><span class="lbl">מע״מ להעברה (בערך, לפני קיזוז מע״מ על הוצאות)</span><strong>${nis(c.vat)}</strong></div>`:''}
      ${defSum?`<div class="stat" style="grid-column:1/-1"><span class="lbl">באשראי, ירד בחודש הבא</span><strong>${nis(defSum)}</strong></div>`:''}
      ${c.spent?(()=>{let fx=0;for(const[id,v] of Object.entries(c.spentBy)) if(isFixed(id)) fx+=v;const vr=c.spent-fx;
        return `<div class="stat" style="grid-column:1/-1"><span class="lbl">קבועות ${nis(fx)} · משתנות ${nis(vr)}</span><div class="split"><div style="width:${fx/c.spent*100}%;background:var(--accent)"></div><div style="flex:1;background:var(--pink)"></div></div></div>`})():''}
      <div class="stat" style="grid-column:1/-1"><span class="lbl">ניצול מהתקציב הפנוי · <span class="num">${Math.round(usedPct)}%</span></span><div class="bar"><div style="width:${usedPct}%;${usedPct>=100?'background:var(--over)':usedPct>85?'background:var(--warn)':''}"></div></div></div>
    </div>

  ${summaryBanner(c)}
  <section class="panel" data-sec="cats">
    <div class="sec-head">
      <h2>${bz?'קטגוריות העסק':'הקטגוריות שלי'}</h2>

        ${!Object.keys(M.budgets).length?`<button class="ghost" id="copyPrev">העתקת תקציבים מהחודש הקודם</button>`:''}

    <div class="catlist">
      ${cats().filter(k=>selCats().includes(k.id)||c.spentBy[k.id]||M.budgets[k.id]).map(k=>{const s=c.spentBy[k.id]||0,b=+M.budgets[k.id]||0,fx=isFixed(k.id),r=ringStyle(s,b,fx?'var(--accent)':'var(--pink)');
        return `<div class="crow ${fx?'fx':'vr'} ${b&&s>b?'over':''}">
          <button class="cinfo" data-cat="${k.id}" aria-label="${esc(catName(k))}: פרטים ותקציב">
            <span class="ring ${r.cls}" style="${r.style}"><span>${cic(k.id)}</span></span>
            <span class="t"><span class="nmline"><b>${esc(catName(k))}</b>${catNote(k.id)&&noteEdit!==k.id?`<em class="cnote">${esc(catNote(k.id))}</em>`:''}</span><small>${b?`תקציב ${nis(b)} | בפועל ${nis(s)}${s>b?' · חריגה':''}`:`בפועל ${nis(s)} · ללא תקציב`}</small></span>
          </button>
          ${noteEdit===k.id?`<form class="cnform" data-noteform="${k.id}"><input id="n-${k.id}" maxlength="24" placeholder="2-3 מילים" value="${esc(catNote(k.id))}" aria-label="הערה קצרה ל${esc(k.name)}"></form>`
            :`<button class="cnbtn" data-note="${k.id}" aria-label="${catNote(k.id)?'עריכת ההערה':'הוספת הערה'} ל${esc(k.name)}" title="הערה קצרה">${ic('pencil')}</button>`}
          <form class="cadd" data-quick="${k.id}">
            <input type="number" inputmode="decimal" min="0" step="any" id="q-${k.id}" placeholder="₪ סכום" aria-label="הוספת סכום ל${esc(k.name)}" value="${quickVal[k.id]||''}">
            <button type="submit" aria-label="הוספה">${ic('plus')}</button>
          </form>
        </div>`}).join('')}
      <button class="crow addcat" id="pickCats">${ic('plus')}<span>בחירת קטגוריות</span></button>
    </div>
  </section>

  <section class="pair">${challengeHTML(c)}${goalCardHTML()}</section>

  <section class="hero duo" style="grid-template-columns:1fr 1fr">

      <div class="sec-head"><h2>תובנות לחודש</h2></div>

      <textarea id="motto" maxlength="160" rows="3" placeholder="למשל: החודש חוסכים לטיסה, כל שקל נחשב">${esc(M.motto||'')}</textarea>

function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,2,2.5,5,10]) if(m*p>=v) return m*p;return 10*p}

function chartsHTML(c){
  const items=Object.entries(c.spentBy).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const total=c.spent;
  const top=items.slice(0,6);const rest=items.slice(6).reduce((s,[,v])=>s+v,0);
  const slices=top.map(([id,v],i)=>({name:catOf(id).name,id,v,col:`var(--c${i+1})`}));
  if(rest>0) slices.push({name:'שאר הקטגוריות',id:'other',v:rest,col:'var(--c7)'});
  // donut
  const R=70,C=2*Math.PI*R;let acc=0;
  const arcs=slices.map(s=>{const len=s.v/total*C;const seg=`<circle r="${R}" cx="100" cy="100" fill="none" stroke="${s.col}" stroke-width="26" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"><title>${esc(s.name)}: ₪${fmt.format(Math.round(s.v))}</title></circle>`;acc+=len;return seg}).join('');
  const donut=total>0?`<div class="donut-wrap">
      <svg class="donut" viewBox="0 0 200 200" role="img" aria-label="פילוח הוצאות לפי קטגוריה">
        <circle r="${R}" cx="100" cy="100" fill="none" stroke="var(--track)" stroke-width="26"/>${arcs}
        <text x="100" y="94" text-anchor="middle" font-size="12" style="fill:var(--muted)">סה״כ הוצאות</text>
        <text x="100" y="116" text-anchor="middle" font-size="20" font-weight="700">₪${fmt.format(Math.round(total))}</text>
      </svg>
      <ul class="legend">${slices.map(s=>`<li><i style="background:${s.col}"></i><span>${esc(s.name)}</span><strong>${nis(s.v)}</strong><em class="num">${Math.round(s.v/total*100)}%</em></li>`).join('')}</ul>
    </div>`:`<div class="empty-note">אין עדיין הוצאות בחודש הזה, אז אין מה לפלח.</div>`;

  // budget vs actual
  const bvaRows=cats().map(k=>({k,s:c.spentBy[k.id]||0,b:+M.budgets[k.id]||0})).filter(r=>r.s||r.b).sort((a,b)=>Math.max(b.s,b.b)-Math.max(a.s,a.b)).slice(0,10);
  const bmax=Math.max(1,...bvaRows.map(r=>Math.max(r.s,r.b)));
  const bva=bvaRows.length?`<div class="bva">${bvaRows.map(r=>{const col=r.b&&r.s>r.b?'var(--over)':r.b&&r.s>=r.b*.85?'var(--warn)':'var(--accent)';
    return `<div class="r">${cic(r.k.id)}<div><div class="top"><span>${esc(catName(r.k))}</span><span>${nis(r.s)}${r.b?` מתוך ${nis(r.b)}`:''}</span></div>
      <div class="track"><div class="fill" style="width:${r.s/bmax*100}%;background:${col}"></div>${r.b?`<div class="mark" style="inset-inline-start:calc(${r.b/bmax*100}% - 1px)" title="תקציב"></div>`:''}</div></div></div>`}).join('')}</div>
    <div class="keyrow" style="margin-top:12px"><span><i style="background:var(--accent)"></i>הוצאה בפועל</span><span><i style="background:var(--fg);width:3px"></i>התקציב שנקבע</span></div>`
    :`<div class="empty-note">כדי לראות כאן השוואה, צריך לקבוע תקציב לקטגוריות.</div>`;

  // 6 months
  let cols='<div class="empty-note">טוען את החודשים הקודמים…</div>';
  if(trend){
    const W=640,H=250,pl=8,pr=52,pt=24,pb=34,iw=W-pl-pr,ih=H-pt-pb;
    const max=niceMax(Math.max(...trend.map(t=>Math.max(t.inc,t.exp))));
    const grid=[0,.25,.5,.75,1].map(f=>{const y=pt+ih*(1-f);return `<line x1="${pl}" x2="${pl+iw}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${W-4}" y="${y+4}" text-anchor="end">₪${fmt.format(max*f)}</text>`}).join('');
    const gw=iw/trend.length,bw=Math.min(28,gw*.3);
    // RTL: oldest on the right
    const bars=trend.map((t,i)=>{const cx=isEn()?pl+gw*(i+.5):pl+iw-gw*(i+.5);const hi=t.inc/max*ih,he=t.exp/max*ih;const isCur=keyOf(t.m)===keyOf(cur);
      return `<rect x="${cx+2}" y="${pt+ih-hi}" width="${bw}" height="${hi}" rx="4" fill="var(--c1)"><title>הכנסות: ₪${fmt.format(t.inc)}</title></rect>
      <rect x="${cx-bw-2}" y="${pt+ih-he}" width="${bw}" height="${he}" rx="4" fill="var(--c2)"><title>הוצאות: ₪${fmt.format(Math.round(t.exp))}</title></rect>
      ${t.inc?`<text class="val" x="${cx+2+bw/2}" y="${pt+ih-hi-5}" text-anchor="middle">${fmt.format(Math.round(t.inc/100)/10)}K</text>`:''}
      ${t.exp?`<text class="val" x="${cx-2-bw/2}" y="${pt+ih-he-5}" text-anchor="middle">${fmt.format(Math.round(t.exp/100)/10)}K</text>`:''}
      <text x="${cx}" y="${H-12}" text-anchor="middle" style="${isCur?'fill:var(--fg);font-weight:700':''}">${SHORT[t.m.getMonth()]}</text>`}).join('');
    const saved=trend.filter(t=>t.inc).map(t=>t.inc-t.exp);
    const avg=saved.length?saved.reduce((a,b)=>a+b,0)/saved.length:0;
    cols=`<div class="cols-wrap"><svg class="cols" viewBox="0 0 ${W} ${H}" role="img" aria-label="הכנסות מול הוצאות בשישה חודשים">${grid}${bars}</svg></div>
      <div class="keyrow"><span><i style="background:var(--c1)"></i>הכנסות</span><span><i style="background:var(--c2)"></i>הוצאות</span>${saved.length?`<span>בממוצע נשאר לך ${nis(avg)} בחודש</span>`:''}</div>`;
  }
  return `<section class="charts">${summaryPanel(c)}
    <div class="panel"><div class="sec-head"><h2>לאן הלך הכסף?</h2><p>${MONTHS[cur.getMonth()]}</p></div>${donut}</div>
    <div class="panel"><div class="sec-head"><h2>תקציב VS בפועל</h2><p>הקטגוריות הגדולות</p></div>${bva}</div>
    <div class="panel wide"><div class="sec-head"><h2>שישה חודשים אחרונים</h2><p>הכנסות מול הוצאות, באלפי ₪</p></div>${cols}</div>
  </section>`;
}

  </div>
  ${noNotes?'':`<aside class="panel notes" aria-label="פתקים">

    <textarea id="notes" placeholder="למשל: לבטל מנוי שלא בשימוש, לשלם ביטוח רכב ב-15…">${esc(M.notes||'')}</textarea>

  ${view==='budget'?`<button class="fab" id="fab" aria-label="הוספת הוצאה מהירה">${ic('plus')}</button>`:''}

  <aside class="sheet" role="dialog" aria-modal="true" aria-label="בחירת קטגוריות">
    <div class="sheet-head"><div><h2>בחירת קטגוריות</h2><span class="lbl">מסמנים רק את מה שרלוונטי · נבחרו <span class="num">${sel.length}</span></span></div>

      return k.icon&&id[0]==='u'?`<div class="pickwrap">${btn}<button class="pdel" data-delcustom="${id}" aria-label="מחיקת ${esc(k.name)}">✕</button></div>`:btn}).join('')}</div></div>`).join('')}
    <form class="bform" id="customAdd"><span class="lbl">קטגוריה משלך</span>
      <input class="txtin" id="cName" maxlength="28" placeholder="שם הקטגוריה, למשל: שיעורי ריקוד" required>
      <span class="lbl">אייקון</span>
      <div class="icpick">${ICON_OPTS.map((o,i)=>`<label><input type="radio" name="cIcon" value="${o}" ${i===0?'checked':''}><span>${ic(o)}</span></label>`).join('')}</div>

function rowHTML(e,def){

  return `<div class="row"><span class="mini" title="${esc(k.name)}">${cic(e.c)}</span>
    <span class="txt">${esc(e.n)||esc(k.name)}<small><span class="num">${d[2]}/${d[1]}</span> · ${esc(k.name)}${tag}</small></span>
    <strong>${nis(e.a)}</strong>
    ${def?'':`<button class="del" data-editexp="${e.id}" aria-label="עריכת הוצאה">${ic('pencil')}</button>`}<button class="del" ${def?'data-defdel':'data-del'}="${e.id}" aria-label="מחיקת הוצאה">✕</button></div>`;

  return `<section class="panel">

async function runSearch(){

  const q=searchQ.trim().toLowerCase();

  rows.push(['נשאר',Math.round(c.free)]);

async function loadGoal(){
  if(goalLoading) return;goalLoading=true;
  const months=[];for(let i=1;i<36;i++) months.push(addMonths(cur,-i));
  const docs=await Promise.all(months.map(m=>store.load(dk(m))));
  const map={};months.forEach((m,i)=>{if(docs[i]) map[dk(m)]=docs[i]});
  goalDocs={book,map};goalLoading=false;render();
}
function goalCardHTML(){
  const t=+B().goalTarget||0;if(!t) return '';
  if(!goalDocs||goalDocs.book!==book){loadGoal();return `<div class="panel goalcard" data-sec="goal"><div class="sec-head"><h2>${esc(M.goalName||B().goalName||'מד החיסכון')}</h2></div><div class="empty-note">מחשבים…</div></div>`}
  const per=[];const sumG=d=>(d.expenses||[]).filter(e=>e.c==='goal').reduce((s,e)=>s+(+e.a||0),0);
  for(const [k,d] of Object.entries(goalDocs.map)) if(k!==dk(cur)){const v=sumG(d);if(v>0) per.push(v)}
  const now$=sumG(M);if(now$>0) per.push(now$);
  const total=per.reduce((a,b)=>a+b,0);const pct=Math.min(100,total/t*100);
  const avg=per.length?total/per.length:0;const left=Math.max(0,t-total);
  const eta=avg>0&&left>0?Math.ceil(left/avg):0;const etaD=addMonths(cur,eta);
  return `<div class="panel goalcard" data-sec="goal">

/* ----- calculator ----- */
let cExpr='', cJust=false;
function cEval(src){
  const t=src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').match(/\d*\.?\d+|[+\-*/()]/g);if(!t) return 0;
  let i=0;const peek=()=>t[i],next=()=>t[i++];
  const prim=()=>{const x=next();if(x==='-') return -prim();if(x==='+') return prim();if(x==='('){const v=expr();if(peek()===')')next();return v}const n=parseFloat(x);if(isNaN(n)) throw 0;return n};
  const term=()=>{let v=prim();while(peek()==='*'||peek()==='/'){const o=next(),r=prim();v=o==='*'?v*r:v/r}return v};
  const expr=()=>{let v=term();while(peek()==='+'||peek()==='-'){const o=next(),r=term();v=o==='+'?v+r:v-r}return v};
  const v=expr();if(!isFinite(v)) throw 0;return Math.round(v*1e8)/1e8;
}
const cFmt=v=>new Intl.NumberFormat('he-IL',{maximumFractionDigits:8}).format(v);
function cUpdate(final){
  const e=document.getElementById('cExpr'),r=document.getElementById('cRes');if(!e||!r) return;
  e.textContent=cExpr||' ';
  let v=null;try{v=cExpr?cEval(cExpr.replace(/[+\-×÷−]$/,'')):0}catch(_){v=null}
  r.textContent=v===null?'…':cFmt(v);r.classList.toggle('final',!!final);
}
function cPress(k){
  const ops='+−×÷';
  if(k==='C'){cExpr='';cJust=false}
  else if(k==='⌫'){cExpr=cExpr.slice(0,-1)}
  else if(k==='='){try{const v=cEval(cExpr);cExpr=String(v).replace('-','−');cJust=true;cUpdate(true);return}catch(_){}}
  else if(k==='%'){const m=cExpr.match(/(\d*\.?\d+)$/);if(m){cExpr=cExpr.slice(0,-m[1].length)+String(+m[1]/100)}}
  else if(k==='vat+'||k==='vat-'){try{const v=cEval(cExpr||'0');cExpr=String(Math.round((k==='vat+'?v*(1+VAT):v/(1+VAT))*100)/100).replace('-','−');cJust=true;cUpdate(true);return}catch(_){}}
  else if(ops.includes(k)){if(!cExpr&&k!=='−') return;cExpr=/[+\-×÷−]$/.test(cExpr)?cExpr.slice(0,-1)+k:cExpr+k;cJust=false}
  else if(k==='('||k===')'){const open=(cExpr.match(/\(/g)||[]).length-(cExpr.match(/\)/g)||[]).length;if(k===')'||(open>0&&/[\d)]$/.test(cExpr))) {if(open>0) cExpr+=')'} else {if(cJust){cExpr='';cJust=false}cExpr+='('}}
  else{if(cJust){cExpr='';cJust=false}if(k==='.'){const m=cExpr.match(/[\d.]*$/)[0];if(m.includes('.')) return;if(!m) k='0.'}cExpr+=k}
  cUpdate(false);
}
function calcHTML(){
  const K=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','(','0','.','='];
  return `<section class="calcwrap"><div class="panel calcp">
    <div class="sec-head"><h2>מחשבון</h2><p>אפשר גם להקליד במקלדת</p></div>
    <div class="cdisp" dir="ltr"><div class="cexpr num" id="cExpr"> </div><div class="cres num" id="cRes">0</div></div>
    <div class="ckeys" dir="ltr">${K.map(k=>`<button type="button" class="ck ${'+−×÷'.includes(k)?'op':k==='='?'eq':['C','⌫','%','('].includes(k)?'fn':''}" data-ck="${k==='('?'(':k}">${k==='('?'( )':k}</button>`).join('')}</div>
    <div class="cextra">
      <button type="button" class="ghost" data-ck="vat+">+ מע״מ <span class="num">18%</span></button>
      <button type="button" class="ghost" data-ck="vat-">בלי מע״מ</button>
      <button type="button" class="primary small" id="cToExp">${ic('plus','ic sm')} הוספת התוצאה כהוצאה</button>
    </div>
  </div></section>`;
}
document.addEventListener('keydown',e=>{
  if(view!=='calc'||quickOpen||openCat||pickOpen) return;
  const tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT') return;
  const map={'*':'×','x':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Backspace':'⌫','Escape':'C','%':'%','.':'.',',':'.','(':'(',')':')'};
  let k=/^\d$/.test(e.key)?e.key:map[e.key];if(!k) return;e.preventDefault();cPress(k);
});

const EN_MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const EN_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const HE_MONTHS=MONTHS.slice(),HE_SHORT=SHORT.slice();
const PFX={'ב':'in ','ל':'to ','מ':'from ','ה':'','ו':'and ','כ':'as ','ש':''};
const EN_KEYS=Object.keys(EN).filter(k=>k.length>1).sort((a,b)=>b.length-a.length);
const esc_re=k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const EN_RX=EN_KEYS.map(k=>[new RegExp('(^|[^\\u0590-\\u05FF])([בלמהוכש]?)'+esc_re(k)+'(?![\\u0590-\\u05FF])','g'),EN[k]+(k.endsWith('-')?' ':'')]);
const trCache=new Map();
const isEn=()=>prefs.lang==='en';
function tr(str){
  if(!isEn()||!str||!/[֐-׿]/.test(str)) return str;
  if(trCache.has(str)) return trCache.get(str);
  const lead=str.match(/^\s*/)[0],trail=str.match(/\s*$/)[0],core=str.trim();
  let out;const pm=core.match(/^הוספת סכום ל(.+)$/);
  if(pm) out=lead+'Add amount to '+tr(pm[1])+trail;
  else if(EN[core]!==undefined) out=lead+EN[core]+trail;
  else{
    out=str;
    for(const [rx,en] of EN_RX){if(!/[֐-׿]/.test(out)) break;out=out.replace(rx,(m,a,p)=>a+(p?PFX[p]:'')+en)}
    out=out.replace(/(^|\s)([בלמ])(?=[A-Za-z₪\d])/g,(m,a,p)=>a+PFX[p]);
  }
  if(/-$/.test(core)&&!trail&&/[A-Za-z:)]$/.test(out)) out+=' ';
  if(/^-/.test(core)===false&&/^[\-–]?\s*$/.test(lead)&&/^[^\s]/.test(out)&&/^ /.test(str)) out=' '+out.trimStart();
  trCache.set(str,out);return out;
}
function translateDOM(root){
  if(!isEn()||!root) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];
  while(w.nextNode()){const n=w.currentNode;if(/[֐-׿]/.test(n.nodeValue)&&n.parentNode&&n.parentNode.nodeName!=='TEXTAREA') nodes.push(n)}
  for(const n of nodes) n.nodeValue=tr(n.nodeValue);
  root.querySelectorAll('[placeholder],[aria-label],[title],[alt]').forEach(el=>{for(const a of ['placeholder','aria-label','title','alt']){const v=el.getAttribute(a);if(v&&/[֐-׿]/.test(v)) el.setAttribute(a,tr(v))}});
}
function applyLang(){
  const en=isEn();
  MONTHS.splice(0,12,...(en?EN_MONTHS:HE_MONTHS));SHORT.splice(0,12,...(en?EN_SHORT:HE_SHORT));
  try{document.documentElement.lang=en?'en':'he';document.documentElement.dir=en?'ltr':'rtl';document.body.style.direction=en?'ltr':'rtl'}catch(e){}
}

function bind(){
  const $=id=>document.getElementById(id);
  const on=(id,ev,fn)=>{const el=$(id);if(el) el.addEventListener(ev,fn)};
  bindExtras($,on);
  bindExtras2($,on);
  document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{prefs.lang=b.dataset.lang==='en'?'en':'he';saveBooks();render()});
  document.querySelectorAll('[data-pal]').forEach(b=>b.onclick=()=>{prefs.palette=b.dataset.pal||'';saveBooks();render()});
  on('vatType','change',e=>{B().vat=e.target.value;saveBooks();render()});
  on('mPrev','click',()=>{cur=addMonths(cur,-1);openCat=null;loadMonth()});
  on('mNext','click',()=>{cur=addMonths(cur,1);openCat=null;loadMonth()});
  on('foldBtn','click',()=>{folderOpen=!folderOpen;render()});
  // folder
  document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>{if(b.dataset.book!==book) switchBook(b.dataset.book);else{folderOpen=false;render()}});
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;dayOpen=false;folderOpen=false;openCat=null;remember();render();if(view==="charts") loadTrend()});
  document.querySelectorAll('[data-chartmonth]').forEach(b=>b.onclick=()=>{const [y,m]=b.dataset.chartmonth.split('-');cur=new Date(+y,+m-1,1);view='charts';folderOpen=false;openCat=null;remember();loadMonth()});
  on('addBook','click',()=>{bookUI='add';render();$('bookName')?.focus()});
  document.querySelectorAll('[data-editbook]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();editId=b.dataset.editbook;bookUI='edit';render();const i=$('bookName');if(i){i.focus();i.select()}});
  on('bookCancel','click',()=>{bookUI=null;render()});
  on('bookAdd','submit',e=>{e.preventDefault();const n=$('bookName').value.trim();if(!n)return;const id='b'+rid();books.push({id,name:n,type:$('bookType').value==='personal'?'personal':'business'});saveBooks();view='budget';switchBook(id)});
  on('bookEdit','submit',e=>{e.preventDefault();const n=$('bookName').value.trim();if(!n)return;const bk=books.find(b=>b.id===editId);if(bk)bk.name=n;saveBooks();bookUI=null;editId=null;render()});
  on('bookDel','click',()=>{bookUI='del';render()});
  document.querySelectorAll('[data-trashbook]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();editId=b.dataset.trashbook;bookUI='del';render()});
  on('bookDelYes','click',()=>{const id=editId;if(id==='personal')return;for(let i=-36;i<=12;i++) store.delRaw(`m-${id}-${keyOf(addMonths(now,i))}`);books=books.filter(b=>b.id!==id);saveBooks();editId=null;if(id===book) switchBook('personal');else{bookUI=null;render()}});
  // budget view
  for(const f of ['salary','extra','savings']) on(f,'change',e=>{M[f]=Math.max(0,+e.target.value||0);persist();render();$(f)?.focus()});
  on('motto','input',e=>{M.motto=e.target.value;$('mottoSaved').textContent=tr(isSample?'בדוגמה זה לא נשמר':'נשמר');persist()});
  on('notes','input',e=>{M.notes=e.target.value;$('notesSaved').textContent=tr(isSample?'בדוגמה הפתקים לא נשמרים':'נשמר');persist()});
  on('names','change',e=>{showNames=e.target.checked;try{localStorage.setItem('kis-names',showNames?'1':'0')}catch(_){};render()});
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{openCat=b.dataset.cat;render();setTimeout(()=>$('eAmt')?.focus(),50)});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const x=M.expenses.find(e=>e.id===b.dataset.del);M.expenses=M.expenses.filter(e=>e!==x);if(x&&x.rec)M.recSkip=(M.recSkip||[]).concat([x.rec]);persist(true);render();
    if(x&&x.from&&!isSample) deferQ=deferQ.then(async()=>{const p=await store.load(x.from);if(p){p.deferred=(p.deferred||[]).filter(e=>e.id!==x.id);store.save(x.from,p)}}).catch(()=>{})});
  document.querySelectorAll('[data-defdel]').forEach(b=>b.onclick=()=>{const id=b.dataset.defdel,nk=nextKey();M.deferred=(M.deferred||[]).filter(e=>e.id!==id);persist(true);render();
    if(!isSample) deferQ=deferQ.then(async()=>{const n=await store.load(nk);if(n){n.expenses=n.expenses.filter(e=>e.id!==id);store.save(nk,n)}}).catch(()=>{})});
  on('copyPrev','click',async()=>{
    const pd=await store.load(dk(addMonths(cur,-1)));
    if(pd&&Object.keys(pd.budgets||{}).length){M.budgets={...pd.budgets};if(!M.savings)M.savings=pd.savings||0;if(!M.goalName)M.goalName=pd.goalName||'';persist(true);render()}
    else{const el=$('copyPrev');if(el){el.textContent=tr('אין תקציבים בחודש הקודם');el.disabled=true}}
  });
  document.querySelectorAll('[data-quick]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const id=f.dataset.quick,inp=f.querySelector('input'),a=+inp.value;if(!(a>0))return;
    quickVal[id]=inp.value;
    M.expenses.push({id:rid(),c:id,a,n:'',d:keyOf(cur)===keyOf(now)?todayISO():keyOf(cur)+'-01',t:Date.now()});persist(true);render();setTimeout(()=>$('q-'+id)?.focus(),20)});
  document.querySelectorAll('[data-stoprec]').forEach(b=>b.onclick=()=>{B().recurring=recurring().filter(r=>r.id!==b.dataset.stoprec);saveBooks();render()});
  document.querySelectorAll('[data-delcustom]').forEach(b=>b.onclick=()=>{const id=b.dataset.delcustom;B().custom=custom().filter(c=>c.id!==id);B().cats=selCats().filter(x=>x!==id);saveBooks();render()});
  on('customAdd','submit',e=>{e.preventDefault();const n=$('cName').value.trim();if(!n)return;const icon=(document.querySelector('input[name=cIcon]:checked')||{}).value||'other';
    const id='u'+rid();B().custom=custom().concat([{id,name:n,icon,fixed:$('cFixed').checked}]);B().cats=selCats().concat([id]);saveBooks();render();
    const sh=document.querySelector('.sheet');if(sh)sh.scrollTop=sh.scrollHeight});
  document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{noteEdit=b.dataset.note;render();const i=$('n-'+noteEdit);if(i){i.focus();i.select()}});
  document.querySelectorAll('[data-noteform]').forEach(f=>{const id=f.dataset.noteform,inp=f.querySelector('input');let done=false;
    const save=()=>{if(done)return;done=true;setNote(id,inp.value);noteEdit=null;render()};
    f.onsubmit=e=>{e.preventDefault();save()};inp.addEventListener('blur',save);
    inp.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();done=true;noteEdit=null;render()}})});
  on('pickCats','click',()=>{pickOpen=true;render()});
  const closePick=()=>{pickOpen=false;render()};
  on('closePick','click',closePick);on('pscrim','click',closePick);on('donePick','click',closePick);
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const id=b.dataset.pick,s=[...selCats()];const i=s.indexOf(id);if(i>=0)s.splice(i,1);else s.push(id);B().cats=s;saveBooks();
    const sc=document.querySelector('.sheet')?.scrollTop||0;render();const sh=document.querySelector('.sheet');if(sh)sh.scrollTop=sc});
  on('loadSample','click',()=>{isSample=true;M=sample();render()});
  on('clearSample','click',()=>{isSample=false;M=blank();render()});
  if(openCat){
    const close=()=>{openCat=null;render()};
    on('closeSheet','click',close);on('scrim','click',close);
    on('budget','change',e=>{const v=Math.max(0,+e.target.value||0);if(v)M.budgets[openCat]=v;else delete M.budgets[openCat];persist();render()});
    on('catNote','change',e=>{setNote(openCat,e.target.value);render()});
    on('goalName','change',e=>{M.goalName=e.target.value.trim();B().goalName=M.goalName;saveBooks();persist();render()});
    on('addForm','submit',e=>{e.preventDefault();const a=+$('eAmt').value;if(!(a>0))return;
      const x={id:rid(),c:openCat,a,n:$('eNote').value.trim(),d:$('eDate').value||todayISO(),t:Date.now()};
      if($('eNext').checked){
        const nk=nextKey(),from=dk(cur);M.deferred=(M.deferred||[]).concat([x]);persist(true);render();
        if(!isSample) deferQ=deferQ.then(async()=>{const n=(await store.load(nk))||blank();n.expenses.push({...x,from});store.save(nk,n)}).catch(()=>{});
      }else{
        if($('eRec').checked&&!isSample){const rec='r'+rid();x.rec=rec;B().recurring=recurring().concat([{id:rec,c:openCat,a,n:x.n,day:+x.d.slice(8,10)||1,from:keyOf(cur)}]);saveBooks()}
        M.expenses.push(x);persist(true);render()}
      setTimeout(()=>$('eAmt')?.focus(),30)});
  }
}
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(onbStep>=0){finishOnb()}else if(editExp){editExp=null;render()}else if(reportOpen){reportOpen=false;render()}else if(custOpen){custOpen=false;render()}else if(dayOpen){dayOpen=false;render()}else if(quickOpen){quickOpen=false;render()}else if(pickOpen){pickOpen=false;render()}else if(openCat){openCat=null;render()}else if(folderOpen){folderOpen=false;render()}});

function sample(){
  const k=keyOf(cur),D=n=>`${k}-${String(n).padStart(2,'0')}`;let i=0;
  const E=(c,a,n,d)=>({id:'s'+(i++),c,a,n,d:D(d),t:i});
  return{...blank(),salary:9800,extra:600,savings:1200,
    budgets:{rent:3600,standing:450,insurance:320,bills:500,grocery:1400,food:450,shopping:400,pets:250,nails:180,face:250,subs:120,fitness:220,car:500},
    expenses:[E('rent',3600,'שכר דירה',1),E('vaad',150,'ועד בית',2),E('insurance',320,'ביטוח בריאות',3),E('grocery',512,'שופרסל',4),E('subs',95,'נטפליקס וספוטיפיי',5),E('nails',180,'לק ג׳ל',7),E('food',138,'ארוחה עם חברות',9),E('pets',210,'אוכל לחתול',10),E('grocery',388,'רמי לוי',11),E('fitness',220,'מנוי לחדר כושר',12),E('shopping',460,'נעליים',14),E('car',250,'דלק',15)]};
}

(async()=>{
  await store.init();
  const s=await store.getRaw('settings');
  if(s&&Array.isArray(s.books)&&s.books.length) books=s.books;
  if(s&&s.prefs) prefs={...prefs,...s.prefs};
  let seen=false;try{seen=localStorage.getItem('kis-onb')==='1'}catch(e){}
  if(!prefs.onboarded&&!seen) onbStep=0;
  if(!books.find(b=>b.id==='personal')) books.unshift({id:'personal',name:'אישי',type:'personal'});
  if(!books.find(b=>b.id===book)) book='personal';
  if(!['charts','calendar','search','calc','backup'].includes(view)) view='budget';
  const cd=await store.getRaw('calendar');if(cd&&Array.isArray(cd.events)) cal=cd;
  loadMonth();
})();
})();
</script>
</body>
</html>
